name: CI

# Fast feedback on every push and pull request; the full browser suite follows only if the
# API layer is healthy, so a broken backend does not cost ten minutes of browser time to discover.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        default: regression
        type: choice
        options: [smoke, regression, api-only]
      browser:
        description: "Browser for the UI tests"
        required: true
        default: chrome
        type: choice
        options: [chrome, firefox, edge]

env:
  MAVEN_ARGS: "-B -ntp"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — API only. No browser, no driver download, done in under a minute.
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run the API suite
        run: mvn $MAVEN_ARGS test -Papi-only -Denv=dev

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2 — the full suite, headless, with the Allure report published to Pages.
  # ---------------------------------------------------------------------------
  ui-tests:
    name: Full suite (${{ github.event.inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 30
    permissions:
      contents: write # required to push the generated report to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Playwright downloads its own browsers on first use. Caching them turns a ~40 s
      # download into a cache hit on every run after the first.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: mvn $MAVEN_ARGS -Pplaywright-install process-test-classes

      # continue-on-error so that a red run still produces a published report —
      # the report is most valuable precisely when tests fail.
      - name: Run the suite (headless)
        id: tests
        continue-on-error: true
        run: |
          mvn $MAVEN_ARGS test \
            -P${{ github.event.inputs.suite || 'regression' }} \
            -Denv=dev \
            -Dheadless=true \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dthread.count=3
        env:
          # Populated from repository secrets when the API under test needs a real token.
          # Empty here, so the framework falls back to logging in with the demo credentials.
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: |
            target/screenshots
            target/playwright-traces
            target/logs
            target/extent-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      # Pulling the previous report's history forward is what gives Allure its
      # pass-rate trend and flakiness view; without it every run looks like the first.
      - name: Fetch previous Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build the Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Publish the report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # The report is published first, then the job is failed — otherwise a red suite
      # would abort the workflow before the evidence was available to look at.
      - name: Fail the build if any test failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::The test suite reported failures — see the published Allure report."
          exit 1
