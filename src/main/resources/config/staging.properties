# ---------------------------------------------------------------------------
# staging environment  ->  mvn test -Denv=staging   (or -Pstaging)
#
# Both demo services expose a single public environment, so the endpoints match
# dev. The file is real, not a placeholder: it is the seam where a second set of
# hosts, tenants or credentials plugs in, and it proves the -Denv switch selects
# a different file at runtime. In a private project this would point at the
# staging hosts and read every credential from the environment.
# ---------------------------------------------------------------------------

# --- web under test ---------------------------------------------------------
web.base.url=https://www.saucedemo.com

# --- api under test ---------------------------------------------------------
api.base.uri=https://dummyjson.com
api.username=emilys
api.password=emilyspass

# Staging is the slower, shared environment: give waits more headroom.
explicit.wait.seconds=25
page.load.timeout.seconds=45
