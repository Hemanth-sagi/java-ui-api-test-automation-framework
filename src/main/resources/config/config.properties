# ---------------------------------------------------------------------------
# Framework defaults.
#
# Lowest-priority source: anything set here is overridden by <env>.properties,
# by an environment variable, or by a -D flag on the command line.
# Environment-specific values (URLs, credentials) belong in dev/staging.properties.
# ---------------------------------------------------------------------------

# --- browser ---------------------------------------------------------------
browser=chrome
headless=true
window.width=1920
window.height=1080

# --- timeouts --------------------------------------------------------------
explicit.wait.seconds=15
page.load.timeout.seconds=30
playwright.action.timeout.ms=15000
playwright.slowmo.ms=0
# Traces are recorded for every Playwright test but only saved when one fails.
playwright.trace=true

# --- execution -------------------------------------------------------------
# Extra attempts granted to a failed test. Set to 0 to see raw, unretried results.
retry.count=1
screenshot.on.failure=true

# --- secrets ---------------------------------------------------------------
# Deliberately blank. When empty the framework authenticates with the username and
# password below to mint a token; CI injects a pre-issued one via the API_TOKEN
# environment variable so no token is ever committed.
api.token=
