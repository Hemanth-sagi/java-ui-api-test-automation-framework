# Where the Allure listener writes raw results. The Maven surefire configuration sets the same
# path; keeping it here as well means `mvn allure:serve` and IDE runs agree with CI.
allure.results.directory=target/allure-results

# Uncomment once the repository exists to turn @Issue("123") and @TmsLink("456") annotations into
# clickable links in the report.
#allure.link.issue.pattern=https://github.com/<your-github-username>/java-ui-api-test-automation-framework/issues/{}
#allure.link.tms.pattern=https://github.com/<your-github-username>/java-ui-api-test-automation-framework/issues/{}
